name: smart_medicine_reminder
description: Offline Android smart medicine reminder with Bluetooth Classic SPP sync.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  bluetooth_classic: ^0.0.4
  flutter_local_notifications: ^20.0.0
  flutter_timezone: ^5.0.1
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
